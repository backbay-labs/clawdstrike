# cargo-audit configuration
#
# Run with: cargo audit
#
# This file consolidates the previously inlined --ignore list from
# .github/workflows/ci.yml so the rationale, owner, and expiry for each
# accepted advisory live in source instead of being scattered across shell
# arrays. cargo-audit's [advisories.ignore] field is a flat list of IDs, so
# justification metadata is captured in the TOML comment immediately above
# each entry. The advisory-expiry guard
# (tools/scripts/check-advisory-expiry.sh) is responsible for failing CI
# when an expiry date passes.
#
# Format for each entry:
#   # <ID> — <crate / short rationale>
#   # Owner: <handle>, Expiry: <YYYY-MM-DD>
#   "<RUSTSEC-XXXX-XXXX>",

[advisories]
