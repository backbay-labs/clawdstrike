version: "1.1.0"
name: reviewer-policy
description: Reviewer agent - strictly read-only access
guards:
  forbidden_path:
    enabled: true
  egress_allowlist:
    enabled: true
    allow: []
    default_action: block
  secret_leak:
    enabled: true
  mcp_tool:
    enabled: true
    allow:
      - read_file
      - list_directory
      - search
      - grep
