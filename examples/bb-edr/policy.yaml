# Clawdstrike canonical policy for the bb-edr example.
#
# This file is consumable by both the canonical Rust engine and the
# @clawdstrike/openclaw plugin (which translates the canonical shape).
# Validate it with:
#   clawdstrike policy validate ./policy.yaml
#   npx clawdstrike policy lint ./policy.yaml

version: "1.2.0"
name: bb-edr
description: EDR response policy - contained writes and curated egress

guards:
  forbidden_path:
    additional_patterns:
      - "**/.ssh/**"
      - "**/.aws/**"
      - "**/.gnupg/**"
      - "**/.env"
      - "**/.env.*"

  path_allowlist:
    enabled: true
    file_write_allow:
      - "./.hush/**"
      - "./reports/**"
      - "./state/**"

  egress_allowlist:
    allow:
      - "api.github.com"
      - "api.openai.com"
    block:
      - "*.onion"
      - "localhost"
      - "127.*"
      - "10.*"
      - "192.168.*"
    default_action: block

  patch_integrity:
    forbidden_patterns:
      - "rm\\s+(-rf?|--recursive)\\s+[/\\\\]"
      - "curl\\s+[^|]*\\|\\s*(bash|sh|zsh)"
      - "wget\\s+[^|]*\\|\\s*(bash|sh|zsh)"

settings:
  fail_fast: true
