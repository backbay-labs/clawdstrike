# Minimal headless tmux config for ClawdStrike Swarm Board sessions.
# The app provides its own terminal UI -- tmux is invisible to the user.

set -g status off
set -g prefix None
unbind-key C-b
set -g escape-time 0
set -g default-terminal "xterm-256color"
set -g history-limit 200000
set -g mouse off
set -g focus-events on

# allow-passthrough requires tmux >= 3.3a
# Enables OSC sequences to pass through for image protocols and modern terminal features.
set -g allow-passthrough on

set -ga terminal-overrides ",xterm-256color:Tc:smcup@:rmcup@"
