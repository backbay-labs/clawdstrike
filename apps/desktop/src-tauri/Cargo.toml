[package]
name = "sdr-desktop"
version = "0.1.0"
description = "Huntronomer desktop command deck for autonomous threat hunting swarms"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "net", "macros"] }

# Low-level socket options (IPV6_V6ONLY, SO_REUSEADDR) for dual-stack LAN discovery.
socket2 = "0.6"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Directories
dirs = "6"

# Logging
tracing = "0.1"

# NATS
async-nats = "0.40"
futures = "0.3"

# P2P discovery (optional)
libp2p-core = "0.43"
libp2p-gossipsub = "0.49.4"
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand"] }
libp2p-noise = "0.46"
libp2p-swarm = { version = "0.47", features = ["macros", "tokio"] }
libp2p-tcp = { version = "0.44", features = ["tokio"] }
libp2p-yamux = "0.47"

# Local crates
hush-core = { path = "../../../crates/libs/hush-core" }
clawdstrike = { path = "../../../crates/libs/clawdstrike" }
spine = { package = "hush-spine", path = "../../../crates/libs/spine" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies if needed

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
async-nats = { path = "../../../infra/vendor/async-nats" }
