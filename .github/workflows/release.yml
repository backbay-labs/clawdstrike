name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test before publishing
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate version consistency
        run: scripts/release-preflight.sh "${GITHUB_REF#refs/tags/v}"

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish hush-core
        run: cargo publish -p hush-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish hush-proxy
        run: cargo publish -p hush-proxy --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish hush-spine
        run: cargo publish -p hush-spine --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish clawdstrike
        run: cargo publish -p clawdstrike --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish hush-cli
        run: cargo publish -p hush-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish npm packages in dependency order
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Detect missing npm package versions
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            packages/adapters/clawdstrike-adapter-core
            packages/sdk/hush-ts
            packages/sdk/clawdstrike
            packages/policy/clawdstrike-policy
            packages/adapters/clawdstrike-claude-code
            packages/adapters/clawdstrike-codex
            packages/adapters/clawdstrike-vercel-ai
            packages/adapters/clawdstrike-langchain
            packages/adapters/clawdstrike-openclaw
            packages/adapters/clawdstrike-opencode
            packages/adapters/clawdstrike-hush-cli-engine
            packages/adapters/clawdstrike-hushd-engine
          )

          missing=()
          for pkg in "${packages[@]}"; do
            name="$(node -e "console.log(require('./${pkg}/package.json').name)")"
            version="$(node -e "console.log(require('./${pkg}/package.json').version)")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already exists"
            else
              echo "${name}@${version} missing"
              missing+=("$pkg")
            fi
          done

          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo "none_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "none_missing=false" >> "$GITHUB_OUTPUT"
            echo "missing_packages=${missing[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install workspace dependencies
        if: steps.detect.outputs.none_missing == 'false'
        run: npm ci --ignore-scripts

      - name: Publish missing npm packages in dependency order
        if: steps.detect.outputs.none_missing == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publish_workspace() {
            local pkg="$1"
            local name version
            name="$(node -e "console.log(require('./${pkg}/package.json').name)")"
            version="$(node -e "console.log(require('./${pkg}/package.json').version)")"

            # Always build/test in dependency order so reruns still produce local
            # workspace artifacts even when a package version is already published.
            echo "Building ${name}@${version}"
            npm run build -w "$pkg"
            echo "Testing ${name}@${version}"
            npm test -w "$pkg"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping publish"
              return 0
            fi

            echo "Publishing ${name}@${version}"
            npm publish -w "$pkg" --provenance
          }

          publish_workspace packages/adapters/clawdstrike-adapter-core
          publish_workspace packages/sdk/hush-ts
          publish_workspace packages/sdk/clawdstrike
          publish_workspace packages/policy/clawdstrike-policy
          publish_workspace packages/adapters/clawdstrike-claude-code
          publish_workspace packages/adapters/clawdstrike-codex
          publish_workspace packages/adapters/clawdstrike-vercel-ai
          publish_workspace packages/adapters/clawdstrike-langchain
          publish_workspace packages/adapters/clawdstrike-openclaw
          publish_workspace packages/adapters/clawdstrike-opencode
          publish_workspace packages/adapters/clawdstrike-hush-cli-engine
          publish_workspace packages/adapters/clawdstrike-hushd-engine

      - name: npm packages already published
        if: steps.detect.outputs.none_missing == 'true'
        run: echo "All npm package versions already exist; skipping npm publish"

  # Publish WASM package to npm
  publish-wasm:
    name: Publish @clawdstrike/wasm to npm
    runs-on: ubuntu-latest
    needs: [publish-npm]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Detect missing wasm npm version
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -e "console.log(require('./crates/libs/hush-wasm/package.json').name)")"
          version="$(node -e "console.log(require('./crates/libs/hush-wasm/package.json').version)")"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "none_missing=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} already exists"
          else
            echo "none_missing=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} missing"
          fi

      - name: Setup Rust target
        if: steps.detect.outputs.none_missing == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.detect.outputs.none_missing == 'false'
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Build and publish @clawdstrike/wasm
        if: steps.detect.outputs.none_missing == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          cd crates/libs/hush-wasm
          wasm-pack build --target web --release --out-dir pkg
          cp package.json pkg/
          cp README.npm.md pkg/README.md
          cp types/hush_wasm.d.ts pkg/

          cd pkg
          npm publish --access public --provenance

      - name: wasm package already published
        if: steps.detect.outputs.none_missing == 'true'
        run: echo "@clawdstrike/wasm version already exists; skipping wasm publish"

  # Publish to PyPI (when hush-py package exists)
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: cd packages/sdk/hush-py && python -m build

      - name: Publish to PyPI
        run: twine upload packages/sdk/hush-py/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # Build release binaries
  build-binaries:
    name: Build Binaries
    needs: preflight
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hush-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: hush-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: hush-darwin-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: hush-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p hush-cli

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/hush ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/hush.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Create GitHub release with binaries
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, publish-crates]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" > "$file.sha256"
            done
            cd ..
          done

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -exec mv {} release-files/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update Homebrew formula with correct SHA256
  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [create-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main  # Checkout main branch for the update

      - name: Calculate SHA256
        id: sha
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          URL="https://github.com/backbay-labs/clawdstrike/archive/refs/tags/v${VERSION}.tar.gz"
          echo "Downloading from: $URL"
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated SHA256: $SHA"

      - name: Update formula
        run: |
          # Update URL with new version
          sed -i 's|url "https://github.com/backbay-labs/clawdstrike/archive/refs/tags/v[^"]*"|url "https://github.com/backbay-labs/clawdstrike/archive/refs/tags/v${{ steps.sha.outputs.version }}.tar.gz"|' infra/packaging/HomebrewFormula/hush.rb
          # Update SHA256
          sed -i 's|sha256 "[^"]*"|sha256 "${{ steps.sha.outputs.sha256 }}"|' infra/packaging/HomebrewFormula/hush.rb

          echo "Updated formula:"
          cat infra/packaging/HomebrewFormula/hush.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/packaging/HomebrewFormula/hush.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew formula for v${{ steps.sha.outputs.version }}"
          git push origin main
