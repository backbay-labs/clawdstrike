# Build and push Docker images to GitHub Container Registry.
#
# Triggers:
# - Push to main branch (infra/docker/Cargo changes)
# - Manual workflow dispatch
#
# Images: ghcr.io/backbay-labs/clawdstrike/<service>:<tag>

name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "infra/docker/**"
      - "Dockerfile.hushd"
      - "Dockerfile.registry"
      - "infra/deploy/config.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional immutable tag to publish alongside latest and sha tags"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/backbay-labs/clawdstrike

# packages: write is required so the workflow can push images to GHCR.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Spine is a single Dockerfile that bakes one of three binaries via a BIN
  # build-arg, so it keeps its own matrix and tag layout (image:<bin>-<tag>).
  spine:
    name: Spine (${{ matrix.bin }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bin: [spine-checkpointer, spine-witness, spine-proofs-api]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN != '' && secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.spine
          build-args: BIN=${{ matrix.bin }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/spine:${{ matrix.bin }}-latest
            ${{ env.IMAGE_PREFIX }}/spine:${{ matrix.bin }}-${{ github.sha }}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('{0}/spine:{1}-{2}', env.IMAGE_PREFIX, matrix.bin, github.event.inputs.release_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        # aquasecurity/trivy-action pinned to v0.30.0 (immutable SHA) instead of
        # the moving @master ref. continue-on-error was previously enabled to
        # suppress scan flakes; removed so HIGH/CRITICAL findings actually
        # block the build.
        uses: aquasecurity/trivy-action@7c2007bcb556501da015201bcba5aa14069b74e2 # v0.30.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/spine:${{ matrix.bin }}-${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # All other images share the same build/push/scan shape; they only differ by
  # image name and Dockerfile path, so they collapse into a single matrix job.
  build-image:
    name: docker:${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tetragon-bridge
            dockerfile: infra/docker/Dockerfile.tetragon-bridge
          - image: hubble-bridge
            dockerfile: infra/docker/Dockerfile.hubble-bridge
          - image: hushd
            dockerfile: Dockerfile.hushd
          - image: control-api
            dockerfile: infra/docker/Dockerfile.control-api
          - image: registry
            dockerfile: Dockerfile.registry
          - image: auditd-bridge
            dockerfile: infra/docker/Dockerfile.auditd-bridge
          - image: k8s-audit-bridge
            dockerfile: infra/docker/Dockerfile.k8s-audit-bridge
          - image: eas-anchor
            dockerfile: infra/docker/Dockerfile.eas-anchor
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN != '' && secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('{0}/{1}:{2}', env.IMAGE_PREFIX, matrix.image, github.event.inputs.release_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        # aquasecurity/trivy-action pinned to v0.30.0 (immutable SHA) instead of
        # the moving @master ref. continue-on-error was previously enabled to
        # suppress scan flakes; removed so HIGH/CRITICAL findings actually
        # block the build.
        uses: aquasecurity/trivy-action@7c2007bcb556501da015201bcba5aa14069b74e2 # v0.30.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
