<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <style>
      .title { font: 600 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #111827; }
      .label { font: 600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #111827; }
      .text  { font: 400 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #111827; }
      .muted { font: 400 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #6b7280; }

      .card { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .box  { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
      .opt  { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .sys  { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827" />
    </marker>
  </defs>

  <rect class="card" x="10" y="10" width="940" height="500" rx="18" />
  <text class="title" x="480" y="46" text-anchor="middle">Clawdstrike Helm Chart (High-Level)</text>
  <text class="muted" x="480" y="70" text-anchor="middle">Core services publish/consume events via NATS JetStream; optional bridges ingest node/network signals.</text>

  <!-- External callers -->
  <rect class="sys" x="40" y="110" width="200" height="70" rx="12" />
  <text class="label" x="140" y="140" text-anchor="middle">Agents / SDKs</text>
  <text class="text" x="140" y="162" text-anchor="middle">policy checks, receipts</text>

  <rect class="opt" x="40" y="200" width="200" height="70" rx="12" />
  <text class="label" x="140" y="230" text-anchor="middle">Ingress (ALB)</text>
  <text class="text" x="140" y="252" text-anchor="middle">optional</text>

  <!-- Core namespace -->
  <rect class="box" x="280" y="100" width="640" height="360" rx="12" />
  <text class="label" x="300" y="126">Namespace: clawdstrike</text>

  <rect class="box" x="320" y="150" width="250" height="70" rx="12" />
  <text class="label" x="445" y="180" text-anchor="middle">hushd</text>
  <text class="text" x="445" y="202" text-anchor="middle">policy + audit API</text>

  <rect class="box" x="630" y="150" width="250" height="70" rx="12" />
  <text class="label" x="755" y="180" text-anchor="middle">proofs-api</text>
  <text class="text" x="755" y="202" text-anchor="middle">proof verification API</text>

  <rect class="box" x="470" y="250" width="260" height="90" rx="12" />
  <text class="label" x="600" y="282" text-anchor="middle">NATS JetStream</text>
  <text class="text" x="600" y="304" text-anchor="middle">event bus + durable streams</text>
  <text class="muted" x="600" y="324" text-anchor="middle">StatefulSet</text>

  <rect class="box" x="320" y="360" width="560" height="80" rx="12" />
  <text class="label" x="600" y="392" text-anchor="middle">Spine services</text>
  <text class="text" x="600" y="414" text-anchor="middle">witness + checkpointer (consume/publish via JetStream)</text>

  <!-- Optional bridges -->
  <rect class="opt" x="280" y="470" width="300" height="40" rx="12" />
  <text class="text" x="430" y="495" text-anchor="middle">Optional bridges</text>

  <rect class="opt" x="610" y="470" width="310" height="40" rx="12" />
  <text class="text" x="765" y="495" text-anchor="middle">Optional monitoring / policies</text>

  <!-- Bridges + monitoring callouts (outside main box, but same release) -->
  <rect class="opt" x="60" y="320" width="180" height="70" rx="12" />
  <text class="label" x="150" y="350" text-anchor="middle">tetragon-bridge</text>
  <text class="text" x="150" y="372" text-anchor="middle">DaemonSet (hostNet)</text>

  <rect class="opt" x="60" y="400" width="180" height="70" rx="12" />
  <text class="label" x="150" y="430" text-anchor="middle">hubble-bridge</text>
  <text class="text" x="150" y="452" text-anchor="middle">Deployment</text>

  <rect class="opt" x="610" y="380" width="250" height="70" rx="12" />
  <text class="label" x="735" y="410" text-anchor="middle">ServiceMonitor</text>
  <text class="text" x="735" y="432" text-anchor="middle">Prometheus scraping</text>

  <rect class="opt" x="610" y="310" width="250" height="60" rx="12" />
  <text class="label" x="735" y="338" text-anchor="middle">NetworkPolicy</text>
  <text class="text" x="735" y="358" text-anchor="middle">default-deny egress</text>

  <!-- Arrows -->
  <path class="arrow" d="M 240 145 L 320 185" />
  <path class="arrow dashed" d="M 240 235 L 320 185" />
  <path class="arrow dashed" d="M 240 235 L 630 185" />

  <path class="arrow" d="M 445 220 L 520 250" />
  <path class="arrow" d="M 755 220 L 680 250" />

  <path class="arrow" d="M 600 340 L 600 360" />
  <path class="arrow" d="M 600 360 L 600 340" />

  <path class="arrow dashed" d="M 240 350 L 470 295" />
  <path class="arrow dashed" d="M 240 435 L 470 300" />

  <path class="arrow dashed" d="M 735 380 L 680 250" />
  <path class="arrow dashed" d="M 735 310 L 680 250" />

  <!-- Legend -->
  <rect x="40" y="480" width="520" height="20" fill="none" />
  <text class="muted" x="40" y="506">Solid arrows: required for core operation. Dashed arrows: optional features/paths.</text>
</svg>
