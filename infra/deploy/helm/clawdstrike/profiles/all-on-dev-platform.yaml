# All-on profile for platform-dev.
# Enables bridges, ingress, service monitoring, and network policy hardening.
global:
  namespace: clawdstrike
  imagePullSecrets:
    - name: ghcr-pull
  nodeSelector:
    kubernetes.io/arch: amd64

namespace:
  create: true
  name: clawdstrike

spine:
  image:
    tag: "spine-checkpointer-2ba330f736d108a1ff37e4d17782edc9532eb73e"
  checkpointer:
    logSeedHex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
    streamReplicas: 1
  witness:
    seedHex: "f1e1d1c1b1a191817161514131211101f0e0d0c0b0a090807060504030201000"

hushd:
  image:
    tag: "2ba330f736d108a1ff37e4d17782edc9532eb73e"
  auth:
    enabled: false
  persistence:
    enabled: false

controlApi:
  enabled: true
  agentNatsUrl: "nats://nats.clawdstrike.dev.backbay.io:4222"
  secrets:
    jwtSecret: "dev-platform-control-api-jwt-secret"
    stripeSecretKey: "sk_test_platform_dev"
    stripeWebhookSecret: "whsec_platform_dev"
    approvalSigningKeypair: "9f03c4d7e1ab25cc6f2e0ff8c56b41a4c66f2e7341d9af81394bb219a8f26d41"
  env:
    RUST_LOG: "info,clawdstrike_control_api=debug"
    NATS_PROVISIONING_MODE: "mock"
    NATS_PROVISIONER_BASE_URL: ""
    NATS_ALLOW_INSECURE_MOCK_PROVISIONER: "true"
    APPROVAL_SIGNING_ENABLED: "true"
    APPROVAL_RESOLUTION_OUTBOX_ENABLED: "true"
    APPROVAL_RESOLUTION_OUTBOX_POLL_INTERVAL_SECS: "5"
    AUDIT_CONSUMER_ENABLED: "false"
    APPROVAL_CONSUMER_ENABLED: "false"
    HEARTBEAT_CONSUMER_ENABLED: "false"
    STALE_DETECTOR_ENABLED: "false"
  postgres:
    enabled: true
    password: "clawdstrike-dev-postgres-password"
    persistence:
      enabled: false

nats:
  jetstream:
    maxFileStoreBytes: "25769803776"
  publicService:
    enabled: true
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      external-dns.alpha.kubernetes.io/hostname: nats.clawdstrike.dev.backbay.io

bridges:
  tetragon:
    enabled: true
    image:
      tag: "2ba330f736d108a1ff37e4d17782edc9532eb73e"
    grpcEndpoint: "http://localhost:54321"
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    nodeSelector:
      kubernetes.io/arch: amd64
  hubble:
    enabled: true
    replicas: 1
    image:
      tag: "2ba330f736d108a1ff37e4d17782edc9532eb73e"
    grpcEndpoint: "http://hubble-relay.kube-system.svc.cluster.local:80"
    nodeSelector:
      kubernetes.io/arch: amd64
  auditd:
    enabled: true
    image:
      tag: "2ba330f736d108a1ff37e4d17782edc9532eb73e"
    nodeSelector:
      kubernetes.io/arch: amd64
  k8sAudit:
    enabled: true
    replicas: 1
    image:
      tag: "2ba330f736d108a1ff37e4d17782edc9532eb73e"
    nodeSelector:
      kubernetes.io/arch: amd64

spiffe:
  enabled: true

easAnchor:
  enabled: true
  image:
    tag: "2ba330f736d108a1ff37e4d17782edc9532eb73e"
  chain:
    rpcUrl: "https://sepolia.base.org"
    chainId: 84532
  secrets:
    existingSecret: "clawdstrike-helm-eas-anchor"

ingress:
  enabled: true
  className: alb
  commonAnnotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/group.name: clawdstrike
  hushd:
    enabled: true
    host: hushd.clawdstrike.dev.backbay.io
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /health
      external-dns.alpha.kubernetes.io/hostname: hushd.clawdstrike.dev.backbay.io
  controlApi:
    enabled: true
    host: control-api.clawdstrike.dev.backbay.io
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
      external-dns.alpha.kubernetes.io/hostname: control-api.clawdstrike.dev.backbay.io
  proofsApi:
    enabled: true
    host: proofs-api.clawdstrike.dev.backbay.io
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      external-dns.alpha.kubernetes.io/hostname: proofs-api.clawdstrike.dev.backbay.io

serviceMonitor:
  enabled: true
  endpoints:
    nats: true
    hushd: true
    proofsApi: false

networkPolicy:
  enabled: true
  allowHubbleRelayEgress: true
  hubbleRelay:
    namespace: kube-system
    podSelector:
      k8s-app: hubble-relay
    ports:
      - 80
      - 4245
