# CI/CD Ruleset
# Designed for automated pipeline environments.
# Inherits forbidden paths, egress denials, secret patterns, patch_integrity
# and mcp_tool defaults from `default`; adds CI-specific egress targets
# (container registries, build tools), CI-secret paths, and pipeline file
# exceptions.
# HushSpec equivalent: https://github.com/backbay-labs/hush/blob/main/rulesets/cicd.yaml
version: "1.2.0"
name: CI/CD
description: Security rules for CI/CD pipeline environments
extends: default

guards:
  forbidden_path:
    additional_patterns:
      # Prevent access to CI secrets
      - "**/.github/secrets/**"
      - "**/.gitlab-ci-secrets/**"
      - "**/.circleci/secrets/**"
    exceptions:
      # Allow reading workflow files
      - "**/.github/workflows/**"
      - "**/.gitlab-ci.yml"
      - "**/.circleci/config.yml"

  egress_allowlist:
    additional_allow:
      # Package registries (essential for CI)
      - "registry.yarnpkg.com"
      - "rubygems.org"
      - "packagist.org"
      - "proxy.golang.org"
      - "storage.googleapis.com"
      # Container registries
      - "*.docker.io"
      - "*.docker.com"
      - "*.gcr.io"
      - "ghcr.io"
      - "*.ecr.aws"
      # Additional code hosting
      - "gitlab.com"
      - "api.gitlab.com"
      # Build tools
      - "gradle.org"
      - "plugins.gradle.org"
      - "repo.maven.apache.org"

  secret_leak:
    additional_patterns:
      - name: docker_auth
        pattern: "(?i)docker[_\\-]?(password|token)\\s*[:=]"
        severity: critical

  patch_integrity:
    max_additions: 5000
    max_deletions: 2500
    require_balance: false
    max_imbalance_ratio: 50.0
    forbidden_patterns:
      - "(?i)disable[\\s_\\-]?(security|auth|ssl|tls)"
      - "(?i)rm\\s+-rf\\s+/"
      - "(?i)chmod\\s+777"

  mcp_tool:
    # Allowlist-mode for CI tools (overrides default's blocklist style).
    allow:
      - read_file
      - write_file
      - list_directory
      - run_tests
      - build
    block:
      - shell_exec
      - deploy_production
    require_confirmation: []
    default_action: block
    max_args_size: 5242880  # 5MB

settings:
  fail_fast: true
  verbose_logging: true
  session_timeout_secs: 1800  # 30 minutes (CI jobs should be fast)
