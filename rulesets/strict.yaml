# Strict Ruleset
# Maximum security with minimal permissions.
# Inherits all forbidden paths, egress denials, and secret patterns from
# `default` and tightens limits, removes egress allowances, and adds extra
# vault/credential/private path coverage.
# HushSpec equivalent: https://github.com/backbay-labs/hush/blob/main/rulesets/strict.yaml
version: "1.2.0"
name: Strict
description: Strict security rules with minimal permissions
extends: default

guards:
  forbidden_path:
    # Additive: inherits default's SSH/AWS/.env/Windows/etc. patterns.
    additional_patterns:
      # Windows registry hives (extra)
      - "**/NTUSER.DAT.*"
      # Windows certificate stores
      - "**/AppData/Roaming/Microsoft/SystemCertificates/**"
      # Registry export files
      - "**/*.reg"
      # Additional strict paths
      - "**/.vault/**"
      - "**/.secrets/**"
      - "**/credentials/**"
      - "**/private/**"

  egress_allowlist:
    # Replace allow list with empty -- no outbound egress permitted.
    allow: []
    block: []
    default_action: block

  secret_leak:
    additional_patterns:
      - name: anthropic_key
        pattern: "sk-ant-[A-Za-z0-9\\-]{95}"
        severity: critical
      - name: npm_token
        pattern: "npm_[A-Za-z0-9]{36}"
        severity: critical
      - name: slack_token
        pattern: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*"
        severity: critical
      - name: generic_api_key
        pattern: "(?i)(api[_\\-]?key|apikey)\\s*[:=]\\s*[A-Za-z0-9]{32,}"
        severity: error

  patch_integrity:
    max_additions: 500
    max_deletions: 200
    require_balance: true
    max_imbalance_ratio: 5.0
    forbidden_patterns:
      - "(?i)disable[\\s_\\-]?(security|auth|ssl|tls)"
      - "(?i)skip[\\s_\\-]?(verify|validation|check)"
      - "(?i)rm\\s+-rf\\s+/"
      - "(?i)chmod\\s+777"
      - "(?i)eval\\s*\\("
      - "(?i)exec\\s*\\("
      - "(?i)reverse[_\\-]?shell"
      - "(?i)bind[_\\-]?shell"

  mcp_tool:
    # Allowlist-only mode (overrides default's blocklist+default_action: block).
    allow:
      - read_file
      - list_directory
      - search
      - grep
    block: []
    require_confirmation: []
    default_action: block
    max_args_size: 524288  # 512KB

  prompt_injection:
    enabled: true
    warn_at_or_above: suspicious
    block_at_or_above: suspicious
    max_scan_bytes: 200000

  jailbreak:
    enabled: true
    detector:
      block_threshold: 40
      warn_threshold: 15
      max_input_bytes: 200000
      session_aggregation: true

settings:
  fail_fast: true
  verbose_logging: false
  session_timeout_secs: 1800  # 30 minutes
