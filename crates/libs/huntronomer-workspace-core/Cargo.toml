[package]
name = "huntronomer-workspace-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
