# AI Agent Ruleset
# Optimized for AI coding assistants (Claude, GPT, etc.)
# Inherits all forbidden paths and secret patterns from `default`, adds extra
# egress allowances for AI/dev tooling, broadens skip_paths for test fixtures,
# and relaxes patch_integrity limits for larger refactors.
# Note: prior to consolidation the forbidden_path list was a hand-curated
# subset; it is now a strict superset of default's (inherits .git-credentials,
# .password-store, .1password, /etc/sudoers, .npmrc, etc.). This is a deliberate
# tightening: AI agents have no legitimate need to read those paths.
version: "1.2.0"
name: AI Agent
description: Security rules optimized for AI coding assistants
extends: default

guards:
  forbidden_path:
    # No additional patterns -- inherit default's full list.
    exceptions:
      # Allow reading .env.example for documentation
      - "**/.env.example"
      - "**/.env.template"

  egress_allowlist:
    additional_allow:
      # Additional AI APIs
      - "api.together.xyz"
      - "*.fireworks.ai"
      # Additional code hosting
      - "gitlab.com"
      - "api.gitlab.com"
      - "bitbucket.org"
      - "api.bitbucket.org"
      # Additional package registries
      - "registry.yarnpkg.com"
      - "rubygems.org"
      - "packagist.org"
      # Documentation
      - "docs.rs"
      - "*.readthedocs.io"
      - "*.readthedocs.org"
      - "developer.mozilla.org"

  secret_leak:
    additional_patterns:
      - name: anthropic_key
        pattern: "sk-ant-[A-Za-z0-9\\-]{95}"
        severity: critical
    skip_paths:
      # Inherits default's skip_paths; these are additive.
      - "**/__tests__/**"
      - "**/*.spec.*"
      - "**/fixtures/**"
      - "**/mocks/**"

  patch_integrity:
    max_additions: 2000
    max_deletions: 1000
    require_balance: false
    max_imbalance_ratio: 20.0
    forbidden_patterns:
      - "(?i)disable[\\s_\\-]?(security|auth|ssl|tls)"
      - "(?i)rm\\s+-rf\\s+/"
      - "(?i)chmod\\s+777"
      - "(?i)reverse[_\\-]?shell"

  mcp_tool:
    # Overrides default's blocklist to permit raw_file_write/delete (AI agents
    # need editor primitives) and adds CI-style require_confirmation entries.
    allow: []
    block:
      - shell_exec
      - run_command
    require_confirmation:
      - git_push
      - deploy
      - publish
    default_action: block
    max_args_size: 2097152  # 2MB

  prompt_injection:
    enabled: true
    warn_at_or_above: suspicious
    block_at_or_above: high
    max_scan_bytes: 200000

  jailbreak:
    enabled: true
    detector:
      block_threshold: 70
      warn_threshold: 30
      max_input_bytes: 200000
      session_aggregation: true

settings:
  fail_fast: false
  verbose_logging: false
  session_timeout_secs: 7200  # 2 hours
