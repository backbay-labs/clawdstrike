[package]
name = "hush-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI for hush-core and clawdstrike — exposes crypto, receipts, jailbreak detection, and watermarking over FFI"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# Enable cbindgen header generation in build.rs.
# The generated hush.h is checked into the repo, so this is only needed
# when the C API surface changes.
cbindgen = ["dep:cbindgen"]

[dependencies]
hush-core.workspace = true
clawdstrike.workspace = true
futures.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
libc = "0.2"

[build-dependencies]
cbindgen = { version = "0.28", optional = true }

[lints]
workspace = true
